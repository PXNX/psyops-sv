name: CI

# Every push to main and every pull request must pass the test suite.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and integration tests
        # The Svelte rune-module transform behaves differently under Bun on CI
        # runners; run that one file under Node where it works.
        run: |
          bun --bun x rstest run --exclude '**/toast.test.ts'
          bun x rstest run src/lib/ui/__tests__/toast.test.ts

  quality:
    name: typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build
        env:
          DATABASE_URL: postgres://psyops:psyops@localhost:5432/psyops
