<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Several hexes and regions grouped into Luftraum sectors">
  <rect width="640" height="280" fill="#04121f"/>
  <g font-family="sans-serif">
    <g stroke="#6366f1" fill="#6366f1" fill-opacity="0.08">
      <rect x="40" y="40" width="240" height="180" rx="8" stroke-dasharray="8 4"/>
      <rect x="320" y="40" width="270" height="180" rx="8" stroke-dasharray="8 4"/>
    </g>
    <text x="52" y="62" font-size="15" fill="#a5b4fc">LR-A1</text>
    <text x="332" y="62" font-size="15" fill="#a5b4fc">LR-A2</text>
    <g stroke="#38bdf8" stroke-opacity="0.4" fill="#38bdf8" fill-opacity="0.07">
      <polygon points="80,100 120,100 140,135 120,170 80,170 60,135"/>
      <polygon points="160,100 200,100 220,135 200,170 160,170 140,135"/>
      <polygon points="120,170 160,170 180,205 160,240 120,240 100,205"/>
      <polygon points="360,100 400,100 420,135 400,170 360,170 340,135"/>
      <polygon points="440,100 480,100 500,135 480,170 440,170 420,135"/>
      <polygon points="520,100 560,100 580,135 560,170 520,170 500,135"/>
    </g>
    <g fill="#94a3b8" font-size="12">
      <text x="190" y="235">3 Hex + 2 Regionen</text>
      <text x="470" y="235">4 Hex + 3 Regionen · 2 ✈</text>
      <text x="40" y="266" font-size="13" fill="#e2e8f0">Mehrere Hexfelder und die Regionen darüber bilden einen Luftraum-Sektor.</text>
    </g>
  </g>
</svg>
